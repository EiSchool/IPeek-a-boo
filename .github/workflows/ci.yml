# IPeek-a-Boo continuous integration (DEVASC Project Activity 4).
#
# Runs automatically on every push to any branch and on every pull request to main.
# The "CI passed" job is set as a required status check on main (Settings > Branches),
# so a pull request can only be merged when lint and every test job are green.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:                # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check code style and errors
        run: python -m flake8 . --count --show-source --statistics

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit, integration and end-to-end tests
        run: python -m coverage run -m unittest -v
      - name: Coverage report (fails below 75%)
        run: python -m coverage report
      - name: Build HTML coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m coverage html
      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        run: |
          echo "lint: ${{ needs.lint.result }}   test: ${{ needs.test.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
