# Settings shared by local runs and the CI pipeline, so both check the same way.

[flake8]
max-line-length = 100
exclude = .git,.venv,venv,__pycache__,exports,IPeek-a-boo

[coverage:run]
source = app, ipinfo

[coverage:report]
# The pipeline fails if the tests stop covering at least this much of the code.
fail_under = 75
show_missing = true
